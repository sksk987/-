name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMGR=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SiataVoice-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct-download APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk siata-voice.apk
          gh release create v1.0.0 siata-voice.apk --title "קריינית סיעתא 1.0.0" --notes "אפליקציית אנדרואיד בעברית לקריינות באמצעות Google Gemini. גרסת מעטפת הדורשת חיבור לאינטרנט ומפתח API משלך." --target "$GITHUB_SHA"
